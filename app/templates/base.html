<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}게시판{% endblock %} - 2-Tier 실습</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">2-Tier 게시판</a>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('new_post') }}">글쓰기</a>
    </div>
  </nav>

  <main class="container" style="max-width: 860px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="container text-center text-muted small my-5">
    응답한 웹 서버: {{ server_hostname }}
  </footer>
</body>
</html>
